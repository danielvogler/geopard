---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      # The shipped GPX tracks are the benchmark: every recorded time, flag and
      # trackpoint in tests/test_matching.py comes from a real match over them,
      # so a numerical regression fails here rather than in somebody's results.
      - name: Test
        env:
          MPLBACKEND: Agg
        run: uv run pytest --cov --cov-report=term-missing

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # A wheel that does not import is the one failure the test job cannot
      # see, because it runs against the source tree rather than the artefact.
      - name: Build and import the wheel
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import geopard; print(geopard.__version__)"
